# Version updates are opened as PRs for human review; nothing auto-merges. Grouped to keep review load manageable.
version: 2
updates:
  - package-ecosystem: npm
    directory: /website
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: cargo
    directory: /program/act-staking
    schedule: { interval: monthly }
  - package-ecosystem: cargo
    directory: /program/act-presale
    schedule: { interval: monthly }
