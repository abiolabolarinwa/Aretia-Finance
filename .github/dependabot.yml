# Version updates are opened as PRs for human review; nothing auto-merges. Grouped to keep review load manageable.
version: 2
updates:
  - package-ecosystem: npm
    directory: /website
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /scripts/launch-pool
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: /scripts/management-fee-proposal
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: /scripts/rebuild-mint
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: /scripts/treasury-v2-setup
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: /scripts/devnet-amm
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
