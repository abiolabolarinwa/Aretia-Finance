name: codeql

# Static analysis (SAST) of the website's TypeScript. Results appear under the repository's Security tab.
on:
  push:
    branches: [main]
    paths: ['website/**']
  pull_request:
    paths: ['website/**']
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
