name: programs-ci

# Checks for the Anchor programs. `host`: compile and unit-test the pure decision logic (authority_handoff.rs).
# Verified locally with rustc 1.97.0 and the committed Cargo.lock files. NOT covered by `host`: the SBF build, the TypeScript
# devnet/validator suites. `onchain` (below) covers the SBF build and the LiteSVM suites.
# Nothing here deploys or touches a cluster.
on:
  push:
    paths: ['program/**', '.github/workflows/programs-ci.yml']
  pull_request:
    paths: ['program/**', '.github/workflows/programs-ci.yml']

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        program: [act-staking]
    defaults:
      run:
        working-directory: program/${{ matrix.program }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.97.0 --profile minimal
      - run: cargo +1.97.0 check --locked
      - run: cargo +1.97.0 test --lib --locked

  onchain:
    # Builds the SBF binaries and runs the LiteSVM suites in program/svm-tests. Slow on a cold cache (installs cargo-build-sbf,
    # downloads Solana platform-tools). Verified locally with exactly these commands.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: cargo install cargo-build-sbf --locked --version 4.4.0
      - run: cargo build-sbf
        working-directory: program/act-staking
      - run: cargo +1.97.1 test
        working-directory: program/svm-tests
