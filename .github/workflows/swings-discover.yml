name: swings-discover

# Asks the site to look for new tokens every 10 minutes (Vercel's free plan has no frequent cron).
# It does nothing until a repository secret named CRON_SECRET exists, and that secret must match the CRON_SECRET
# set in Vercel. Nothing here deploys or changes code. GitHub may delay a scheduled run by several minutes.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  discover:
    name: discover (${{ matrix.chain }}, ${{ matrix.stage }})
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # One network and one part of its work per job, so a slow one cannot hold up or fail the rest. Each request is
    # allowed 60 seconds on the site; the busiest networks have their slow parts in separate requests.
    strategy:
      fail-fast: false
      # GeckoTerminal allows about 30 requests a minute to the site as a whole, so the jobs go one at a time rather than together
      # (a burst of nine got 429 "too many requests" on Solana's trending and second-page feeds).
      max-parallel: 1
      matrix:
        include:
          - { chain: solana, stage: feeds }
          - { chain: solana, stage: own }
          - { chain: solana, stage: refresh }
          - { chain: ethereum, stage: feeds }
          - { chain: ethereum, stage: own }
          - { chain: ethereum, stage: refresh }
          - { chain: bnb, stage: feeds }
          - { chain: bnb, stage: own }
          - { chain: bnb, stage: refresh }
          - { chain: polygon, stage: 'feeds,own,refresh' }
          - { chain: base, stage: 'feeds,own,refresh' }
          - { chain: arbitrum, stage: 'feeds,own,refresh' }
          - { chain: optimism, stage: 'feeds,own,refresh' }
          - { chain: avalanche, stage: 'feeds,own,refresh' }
          - { chain: robinhood, stage: 'feeds,own,refresh' }
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      CHAIN: ${{ matrix.chain }}
      STAGE: ${{ matrix.stage }}
    steps:
      - name: Skip until the secret is set
        if: env.CRON_SECRET == ''
        run: echo "CRON_SECRET is not set as a repository secret, so nothing was run."
      - name: Run discovery
        if: env.CRON_SECRET != ''
        run: |
          status=$(curl -sS -m 90 -o response.json -w '%{http_code}' -H "Authorization: Bearer ${CRON_SECRET}" "https://aretiafinance.org/api/swings-discover?chain=${CHAIN}&stage=${STAGE}")
          echo "HTTP ${status}"
          head -c 600 response.json || true
          echo
          # A source that failed is reported in the answer (HTTP stays 200 so the other sources still run): show it as a warning.
          if grep -Eq '"error":"' response.json; then echo "::warning::${CHAIN} (${STAGE}): at least one source reported an error. See the answer printed above."; fi
          test "$status" = "200"

  # Keeps the Markets lists warm. The site's CDN serves a list it has seen for up to a day while it refreshes it, so
  # warming the common ones means a visitor is not the first to ask GeckoTerminal when the lists are cold or it is busy.
  warm-markets:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: discover
    if: ${{ always() }}
    steps:
      - name: Ask for each list once
        run: |
          for kind in trending top gainers new; do
            for chain in solana ethereum bnb polygon base arbitrum optimism avalanche robinhood; do
              status=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' "https://aretiafinance.org/api/swings-market?kind=${kind}&chain=${chain}&window=h24&page=1" || echo 000)
              echo "${kind} ${chain}: HTTP ${status}"
              sleep 2
            done
          done
