name: swings-discover

# Asks the site to look for new tokens every 10 minutes (Vercel's free plan has no frequent cron).
# It does nothing until a repository secret named CRON_SECRET exists, and that secret must match the CRON_SECRET
# set in Vercel. Nothing here deploys or changes code. GitHub may delay a scheduled run by several minutes.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  discover:
    name: discover (${{ matrix.chain }})
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # One network per job, so a slow one cannot hold up or fail the rest.
    strategy:
      fail-fast: false
      matrix:
        chain: [solana, ethereum, bnb, polygon, base, arbitrum, optimism, avalanche, robinhood]
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      CHAIN: ${{ matrix.chain }}
    steps:
      - name: Skip until the secret is set
        if: env.CRON_SECRET == ''
        run: echo "CRON_SECRET is not set as a repository secret, so nothing was run."
      - name: Run discovery
        if: env.CRON_SECRET != ''
        run: |
          status=$(curl -sS -m 90 -o response.json -w '%{http_code}' -H "Authorization: Bearer ${CRON_SECRET}" "https://aretiafinance.org/api/swings-discover?chain=${CHAIN}")
          echo "HTTP ${status}"
          head -c 600 response.json || true
          echo
          # A source that failed is reported in the answer (HTTP stays 200 so the other sources still run): show it as a warning.
          if grep -Eq '"error":"' response.json; then echo "::warning::${CHAIN}: at least one source reported an error. See the answer printed above."; fi
          test "$status" = "200"
