name: website-ci

# Runs on every push and pull request that touches the website. Nothing here deploys.
on:
  push:
    paths: ['website/**', '.github/workflows/website-ci.yml']
  pull_request:
    paths: ['website/**', '.github/workflows/website-ci.yml']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run typecheck:api
      - run: npm run lint
      - run: npm run build
      # Fails on any high or critical advisory in production dependencies that website/audit-allowlist.json does not accept
      # (each accepted one carries a written reason). Moderate and lower advisories are printed for review, not blocking.
      - name: Dependency advisories (gate)
        run: node scripts/audit-gate.mjs
      - name: Dependency advisories (report)
        run: npm audit --omit=dev || true

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # Scans the full history for committed secrets (keys, tokens, keypairs).
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
