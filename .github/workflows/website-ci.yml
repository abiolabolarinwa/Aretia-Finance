name: website-ci

# Runs on every push and pull request that touches the website. Nothing here deploys.
on:
  push:
    paths: ['website/**', '.github/workflows/website-ci.yml']
  pull_request:
    paths: ['website/**', '.github/workflows/website-ci.yml']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run typecheck:api
      - run: npm run lint
      - run: npm run build
      # Fails on high or critical advisories in production dependencies. Moderate ones are reported only; they are
      # tracked in docs/audit/THIRD_PARTY_DEPENDENCIES.md. If a high advisory has no fix, record it there with a
      # reachability assessment and an expiry date, then pin the exception here -- do not re-add `|| true`.
      - name: Dependency advisories (blocking at high)
        run: npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Scans the full history for committed secrets (keys, tokens, keypairs).
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
