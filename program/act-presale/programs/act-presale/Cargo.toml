[package]
name = "act-presale"
version = "0.1.0"
description = "Aretia Finance -- ACT public presale (Oct 1 - Dec 1 2026 window). See PRESALE_DESIGN.md for the full design record. Devnet only; not yet deployed anywhere."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "act_presale"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
# Local-validator testing ONLY -- shrinks the notion of "a day" the same way
# act-staking's test-fast-clock does, so a 60-day sale window and 180-day
# vesting can be exercised without waiting real days. Never pass this to a
# devnet or mainnet build.
test-fast-clock = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token_2022"] }
pyth-solana-receiver-sdk = "0.3.1"
