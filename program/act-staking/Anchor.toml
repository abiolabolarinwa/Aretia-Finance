[toolchain]
anchor_version = "0.30.1"

[features]
resolution = true
skip-lint = false

[programs.devnet]
act_staking = "ActStk11111111111111111111111111111111111"

[programs.mainnet]
act_staking = "ActStk11111111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

# NOTE: the program id above ("ActStk1111...") is a readable PLACEHOLDER,
# not a real deployed address -- it has never been generated by `anchor
# keygen` or deployed anywhere. Before the first `anchor build`, run
# `anchor keygen new -o target/deploy/act_staking-keypair.json` and replace
# both the value here and the `declare_id!(...)` in
# programs/act-staking/src/lib.rs with the real generated pubkey. This file
# has not been machine-verified -- see STAKING_DESIGN.md, "Toolchain gap."
