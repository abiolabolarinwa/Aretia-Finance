[package]
name = "act-staking"
version = "0.1.0"
description = "Aretia Finance -- ACT staking (tiered access infrastructure, Part VIII Sec. 30). Not yet compiled or deployed -- see STAKING_DESIGN.md."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "act_staking"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token_2022"] }
