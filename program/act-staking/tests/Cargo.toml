[package]
name = "act-staking-it"
version = "0.1.0"
edition = "2021"
publish = false
description = "Integration tests for the act-staking program, run in LiteSVM against the compiled program (no validator, no devnet)."

# Its own workspace: the Solana crates here are a different major version from the ones the on-chain program builds with.
[workspace]

[dependencies]
litesvm = "0.18"
solana-address = { version = "~2.7", features = ["curve25519", "decode"] }
solana-keypair = "3"
solana-signer = "3"
solana-instruction = "~3.5"
solana-message = "4"
solana-transaction = "4"
solana-account = "4"
solana-clock = "~3.2"
sha2 = "0.10"

