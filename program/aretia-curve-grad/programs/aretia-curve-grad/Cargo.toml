[package]
rust-version = "1.79"
name = "aretia-curve-grad"
version = "0.1.0"
description = "Aretia Finance: bonding curve that graduates into an Aretia Pool. Devnet only until audited."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "aretia_curve_grad"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token_2022"] }
curve-math = { path = "../../curve-math" }
solana-program = "=1.18.26"
