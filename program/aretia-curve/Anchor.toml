[toolchain]
anchor_version = "0.30.1"

[features]
resolution = true
skip-lint = false

[programs.devnet]
aretia_curve = "9HVuUHU4mm6PYZFRnY7KzuGsHVSZ8QUVavarJLpJt5f4"

# No [programs.mainnet] on purpose: this program is unaudited and must not go to mainnet. See docs/BONDING_CURVE.md.

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

# Built here with cargo build-sbf (no Anchor CLI): the program is plain anchor-lang 0.30.1. The program keypair stays outside the repo.
