[package]
rust-version = "1.79"
name = "aretia-pool"
version = "0.1.0"
description = "Aretia Finance: constant-product swap pool for tokens made on the Launch page. Devnet only until audited."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "aretia_pool"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token_2022"] }
pool-math = { path = "../../pool-math" }
solana-program = "=1.18.26"
