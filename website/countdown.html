<style>
  :root {
    --brand: #190880;
    --bg: #FAF9F5;
    --ink: #190880;
    --ink-soft: #4a4560;
    --ink-faint: #8a85a0;
    --border-soft: rgba(25,8,128,.14);
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
    --ease: cubic-bezier(.16,1,.3,1);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(circle at 50% 0%, #2a1aa8 0%, #150660 55%, #0b0330 100%);
    font-family: var(--sans);
    color: #fff;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 480px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 22px;
    padding: 36px 30px 30px;
    text-align: center;
    backdrop-filter: blur(6px);
  }
  .brand-row {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-weight: 700; font-size: 15px; margin-bottom: 18px;
  }
  .brand-row .mark {
    width: 26px; height: 26px; border-radius: 8px;
    background: linear-gradient(135deg, #fff3c4, #f0c14b, #b8860b);
    display: inline-block;
  }
  .eyebrow {
    font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: #c9c0ff; margin-bottom: 10px;
  }
  h1 { font-size: 24px; margin: 0 0 22px; line-height: 1.3; }
  .clock { display: flex; justify-content: center; gap: 10px; margin-bottom: 22px; }
  .unit {
    flex: 1; max-width: 82px;
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 12px; padding: 12px 4px;
  }
  .unit span { display: block; font-family: var(--mono); font-size: 26px; font-weight: 700; }
  .unit small { display: block; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; opacity: .7; margin-top: 3px; }
  .price {
    text-align: left; border-top: 1px solid rgba(255,255,255,.14); border-bottom: 1px solid rgba(255,255,255,.14);
    padding: 14px 4px; margin-bottom: 22px;
  }
  .price-row { display: flex; justify-content: space-between; font-size: 13.5px; padding: 4px 0; color: #d8d4f5; }
  .price-row strong { color: #fff; }
  .cta {
    display: inline-flex; width: 100%; justify-content: center;
    background: #fff; color: var(--brand); font-weight: 700; font-size: 14px;
    padding: 13px; border-radius: 999px; text-decoration: none; margin-bottom: 18px;
    transition: transform 160ms var(--ease);
  }
  .cta:hover { transform: translateY(-1px); }
  .social { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .social a {
    font-size: 12px; font-weight: 600; padding: 7px 14px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.22); color: #fff; text-decoration: none;
    transition: background 160ms var(--ease);
  }
  .social a:hover { background: rgba(255,255,255,.12); }
  .live-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--mono); font-size: 11px; font-weight: 700;
    padding: 4px 10px; border-radius: 999px;
    background: linear-gradient(135deg, #fff3c4, #f0c14b, #b8860b);
    color: #4a2e00; margin-bottom: 16px;
  }
  .live-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: #4a2e00; display: inline-block; animation: pulse 1.6s ease infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  @media (max-width: 420px) {
    .unit { padding: 10px 2px; }
    .unit span { font-size: 20px; }
    h1 { font-size: 20px; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand-row"><span class="mark"></span> Aretia Finance</div>
    <div class="live-badge"><span class="dot"></span> LIVE COUNTDOWN</div>
    <div class="eyebrow">ACT Presale</div>
    <h1 id="pc-title">Presale opens in</h1>
    <div class="clock">
      <div class="unit"><span id="pc-days">00</span><small>Days</small></div>
      <div class="unit"><span id="pc-hours">00</span><small>Hours</small></div>
      <div class="unit"><span id="pc-mins">00</span><small>Mins</small></div>
      <div class="unit"><span id="pc-secs">00</span><small>Secs</small></div>
    </div>
    <div class="price">
      <div class="price-row"><span>Price</span><strong>$0.01 / ACT</strong></div>
      <div class="price-row"><span>Min buy</span><strong>$10</strong></div>
      <div class="price-row"><span>Max buy</span><strong>$10,000</strong></div>
      <div class="price-row"><span>Vesting</span><strong>25% TGE, 75% over 180 days</strong></div>
      <div class="price-row"><span>Accepts</span><strong>USDC · USDT · SOL</strong></div>
    </div>
    <a href="presale.html" class="cta">See presale details</a>
    <div class="social">
      <a href="https://x.com/AretiaFinance" target="_blank" rel="noopener">X</a>
      <a href="https://discord.gg/fDXvn2nHf" target="_blank" rel="noopener">Discord</a>
      <a href="https://t.me/+MWgiRISNMWM2NmI0" target="_blank" rel="noopener">Telegram</a>
      <a href="https://github.com/abiolabolarinwa/Aretia-Finance" target="_blank" rel="noopener">GitHub</a>
    </div>
  </div>

  <script>
    (function () {
      var PRESALE_OPEN = new Date("2026-10-01T00:00:00Z").getTime();
      var dEl = document.getElementById("pc-days");
      var hEl = document.getElementById("pc-hours");
      var mEl = document.getElementById("pc-mins");
      var sEl = document.getElementById("pc-secs");
      var titleEl = document.getElementById("pc-title");

      function pad(n) { return String(n).padStart(2, "0"); }

      function tick() {
        var diff = PRESALE_OPEN - Date.now();
        if (diff <= 0) {
          dEl.textContent = hEl.textContent = mEl.textContent = sEl.textContent = "00";
          titleEl.textContent = "Presale is live";
          return;
        }
        var days = Math.floor(diff / 86400000);
        var hours = Math.floor((diff % 86400000) / 3600000);
        var mins = Math.floor((diff % 3600000) / 60000);
        var secs = Math.floor((diff % 60000) / 1000);
        dEl.textContent = pad(days);
        hEl.textContent = pad(hours);
        mEl.textContent = pad(mins);
        sEl.textContent = pad(secs);
      }

      tick();
      setInterval(tick, 1000);
    })();
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
