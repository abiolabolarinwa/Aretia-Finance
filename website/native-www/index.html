<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Aretia Finance</title>
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --fg: #0b0b0d; --muted: #5a5a60; --line: rgba(0, 0, 0, 0.14); }
      @media (prefers-color-scheme: dark) { :root { --bg: #0b0b0d; --fg: #fafafa; --muted: #a6a6ad; --line: rgba(255, 255, 255, 0.2); } }
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; padding: 24px; box-sizing: border-box; font: 16px/1.5 -apple-system, system-ui, 'Segoe UI', sans-serif; color: var(--fg); background: var(--bg); text-align: center; }
      main { max-width: 22rem; display: grid; gap: 12px; justify-items: center; }
      h1 { margin: 0; font-size: 1.25rem; letter-spacing: -0.01em; }
      p { margin: 0; color: var(--muted); }
      button { min-height: 44px; padding: 0 22px; font: inherit; font-weight: 600; color: var(--bg); background: var(--fg); border: 0; border-radius: 999px; cursor: pointer; }
      button:focus-visible { outline: 2px solid #4f46e5; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Aretia can’t connect right now</h1>
      <p>Check your internet connection and try again. Your funds and keys are never held by Aretia, so nothing is at risk while you are offline.</p>
      <button type="button" id="retry">Try again</button>
    </main>
    <script>
      document.getElementById('retry').addEventListener('click', function () {
        window.location.replace('https://aretiafinance.org/wallet');
      });
    </script>
  </body>
</html>
